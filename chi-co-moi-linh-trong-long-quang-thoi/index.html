<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../music.css?v=4">
    <script src="../music.js?v=4"></script>
    <script src="unlock.js"></script>
    <title>Gửi Linh 20/10</title>
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }

        /* Các trang được mở bên trong khung này, nên chuyển trang không làm ngắt nhạc */
        .frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .gift {
            cursor: default;
            padding: 16px;
            text-align: center;
        }

        .lock {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 380px;
        }

        .lock--shake {
            animation: lock-shake 0.4s;
        }

        @keyframes lock-shake {
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-6px); }
        }

        .lock__input {
            flex: 1;
            min-width: 0;
            padding: 12px 18px;
            border: 1px solid #39c6d6;
            border-radius: 999px;
            color: #fff;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            outline: none;
        }

        .lock__input:focus {
            box-shadow: 0 0 14px rgba(57, 198, 214, 0.7);
        }

        .lock__btn {
            padding: 12px 22px;
            border: 1px solid #39c6d6;
            border-radius: 999px;
            color: #fff;
            font-family: "Segoe Script", cursive;
            font-size: 16px;
            background: rgba(57, 198, 214, 0.25);
            box-shadow: 0 0 14px rgba(57, 198, 214, 0.6);
            cursor: pointer;
        }

        .lock__btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .lock__msg {
            width: 100%;
            min-height: 1.4em;
            color: #ffb3c1;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <iframe class="frame" title="Gửi em Linh 20/10" allow="autoplay"></iframe>

    <div class="gift">
        <span class="gift__box">🎁</span>
        <span class="gift__text">Quà này chỉ dành riêng cho Linh thui 💝</span>
        <form class="lock">
            <input class="lock__input" type="password" placeholder="Nhập mật khẩu nha" autocomplete="off" required>
            <button class="lock__btn" type="submit">Mở quà 🎁</button>
            <p class="lock__msg" role="status"></p>
        </form>
    </div>
</body>
</html>
