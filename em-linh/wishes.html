<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../wishes.css">
    <link rel="stylesheet" href="../music.css?v=4">
    <link rel="stylesheet" href="linh.css">

    <title>Gửi em Linh 20/10</title>
</head>

<body>
    <div class="sky"></div>

    <p class="subtitle">Gửi riêng em Linh xinh đẹp 🌸</p>

    <!-- Lời chúc và ảnh được giải mã ở trang ngoài (index.html) rồi điền vào .wish và .photos -->
    <div class="pages">
        <section class="page">
            <div class="sticker sticker--cat">
                <span class="sticker__bubble">Meow~ 20/10 vui vẻ nha Linh!</span>
                <span class="sticker__main">🐱</span>
                <span class="sticker__float" style="--x:-60px; --d:0s">💕</span>
                <span class="sticker__float" style="--x:55px; --d:0.8s">💖</span>
                <span class="sticker__float" style="--x:-20px; --d:1.6s">💗</span>
            </div>
            <div class="wishes">
                <div class="wish"></div>
            </div>
            <div class="photos"></div>
        </section>

        <section class="page">
            <div class="sticker sticker--bunny">
                <span class="sticker__bubble">Tặng em bó hoa nè 💐</span>
                <span class="sticker__main">🐰</span>
                <span class="sticker__float" style="--x:-60px; --d:0s">🌸</span>
                <span class="sticker__float" style="--x:55px; --d:0.7s">🌷</span>
                <span class="sticker__float" style="--x:10px; --d:1.4s">🌼</span>
            </div>
            <div class="wishes">
                <div class="wish"></div>
            </div>
            <div class="photos"></div>
        </section>

        <section class="page">
            <div class="sticker sticker--bear">
                <span class="sticker__bubble">Ôm em một cái thật chặt nè 🤗</span>
                <span class="sticker__main">🐻</span>
                <span class="sticker__float" style="--x:-55px; --d:0s">🍯</span>
                <span class="sticker__float" style="--x:55px; --d:0.9s">💛</span>
                <span class="sticker__float" style="--x:0px; --d:1.8s">✨</span>
            </div>
            <div class="wishes">
                <div class="wish"></div>
            </div>
            <div class="photos"></div>
        </section>

        <section class="page">
            <div class="sticker sticker--penguin">
                <span class="sticker__bubble">Thư gửi em Linh đây 💌</span>
                <span class="sticker__main">🐧</span>
                <span class="sticker__float" style="--x:-60px; --d:0s">💌</span>
                <span class="sticker__float" style="--x:55px; --d:0.8s">🎉</span>
                <span class="sticker__float" style="--x:-5px; --d:1.6s">💝</span>
            </div>
            <div class="wishes">
                <div class="wish"></div>
            </div>
            <div class="photos"></div>
        </section>
    </div>

    <nav class="pager">
        <button class="pager__btn pager__btn--prev" aria-label="Trang trước">‹</button>
        <div class="pager__dots"></div>
        <button class="pager__btn pager__btn--next" aria-label="Trang sau">›</button>
    </nav>

    <div class="links">
        <a class="back-btn" href="flowers.html">← Quay lại vườn hoa</a>
        <a class="back-btn feel-btn" href="feelings.html">Gửi cảm nghĩ 💬</a>
    </div>

    <div class="lightbox"><img alt="Ảnh của Linh"></div>

    <script src="../sky.js"></script>
    <script src="fill.js"></script>
    <script src="../wishes.js"></script>
