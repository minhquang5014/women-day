<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="music.css?v=3">
    <script src="music.js?v=3"></script>
    <title>Happy Woman's day 20/10</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Các trang được mở bên trong khung này, nên chuyển trang không làm ngắt nhạc */
        .frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe class="frame" title="Happy Woman's day 20/10" allow="autoplay"></iframe>
    <script>
        // Mở đúng trang được yêu cầu (vd. index.html?page=wishes.html), mặc định là vườn hoa
        const page = new URLSearchParams(location.search).get("page");
        document.querySelector(".frame").src = /^[\w-]+\.html$/.test(page) && page !== "index.html" ? page : "flowers.html";
    </script>
</body>
</html>
